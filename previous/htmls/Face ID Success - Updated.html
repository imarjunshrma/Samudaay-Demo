<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#f2780d",
                        "on-background": "#241912",
                        "outline": "#8b7264",
                        "surface": "#fff8f5",
                        "surface-container": "#ffeadf",
                        "on-primary": "#ffffff",
                        "on-surface": "#241912",
                        "on-surface-variant": "#574236",
                        "background": "#f8f7f5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-sm": "0.5rem",
                        "stack-gap-lg": "1.5rem",
                        "container-padding": "1rem",
                        "section-margin": "2rem",
                        "stack-gap-md": "1rem"
                    },
                    "fontFamily": {
                        "display": ["Public Sans", "sans-serif"],
                        "body": ["Public Sans", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 48
        }
        .success-glow {
            box-shadow: 0 0 40px 10px rgba(242, 120, 13, 0.05)
        }
        .tap-active:active {
            transform: scale(0.98)
        }
        body {
            min-height: max(884px, 100dvh);
            font-family: 'Public Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-background text-on-surface overflow-hidden">
<div class="flex flex-col min-h-screen max-w-[448px] mx-auto relative bg-background shadow-xl">
<!-- Top Navigation -->
<header class="flex items-center justify-between px-4 h-16 w-full z-10">
<button class="w-12 h-12 flex items-center justify-start rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface text-3xl">arrow_back</span>
</button>
<div class="font-bold text-lg text-on-surface">Security</div>
<div class="w-12"></div>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-container-padding relative z-10 pb-20">
<!-- Success Animation Container -->
<div class="relative mb-8">
<!-- Background Pulse Rings -->
<div class="absolute inset-0 bg-primary/5 rounded-full scale-125 animate-pulse"></div>
<div class="absolute inset-0 bg-primary/10 rounded-full scale-150 opacity-20"></div>
<!-- Icon Circle -->
<div class="w-32 h-32 bg-white rounded-full flex items-center justify-center success-glow border-2 border-primary/10 z-20 relative">
<span class="material-symbols-outlined text-primary !text-6xl" style="font-variation-settings: 'wght' 600;">check_circle</span>
</div>
</div>
<!-- Content -->
<div class="text-center space-y-3 px-4">
<h1 class="text-3xl font-bold text-on-surface tracking-tight">
                    Identity Verified
                </h1>
<p class="text-on-surface-variant text-base leading-relaxed max-w-[280px] mx-auto">
                    Access granted. Welcome back to the Cobbler community.
                </p>
</div>
<!-- Decorative Info Card -->
<div class="mt-10 w-full bg-white rounded-2xl p-5 border border-primary/10 shadow-sm">
<div class="flex items-center gap-4">
<div class="w-14 h-14 rounded-xl bg-primary/5 flex items-center justify-center overflow-hidden border border-primary/10">
<img alt="artisanal leather texture" class="w-full h-full object-cover opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpqQAg4YVRQx1XvtL9Z_RFcYiNMHyXoeZtEjZXEAEO0dcXMjW9tGYvB3lSvGWM2bnBrUatcRQAMcvyNH8rLlcBQuf96WjaDJv4I_v0szntALVyJpYnnIbkbFdWcV7xHhzL5VM1RPmS5kycfoO-ZucIS89BLEN3_ys7hrWyMj8LNgeM50sRkNleceSr-9aVCSesu7067s3uRR9pJ15ktlafHri5WnpgRU4DhYb-OJZSpRZC-M2UfmIiDpgUMH9SK-MKU5CNxVsMNmN7"/>
</div>
<div class="flex-1">
<div class="font-bold text-on-surface text-base">Authenticated Account</div>
<div class="text-sm text-outline font-medium">Master Leatherworker Level</div>
</div>
<span class="material-symbols-outlined text-primary fill-1" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<footer class="p-container-padding pb-8">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-bold text-lg shadow-lg shadow-primary/20 tap-active transition-all active:translate-y-0.5">
                Continue
            </button>
<p class="mt-4 text-center text-xs text-outline font-medium tracking-wide">
                SECURED BY ARTISANAUTH™ BIOMETRICS
            </p>
</footer>
</div>
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 bg-background">
<div class="absolute top-[-5%] right-[-10%] w-[300px] h-[300px] bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[10%] left-[-15%] w-[400px] h-[400px] bg-primary/5 rounded-full blur-[120px]"></div>
</div>
</body></html>
