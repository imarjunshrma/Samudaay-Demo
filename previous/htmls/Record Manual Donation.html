<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Manual Donation Entry - Indian Cobbler Community</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#f2780d",
              "background-light": "#f8f7f5",
              "background-dark": "#221810",
            },
            fontFamily: {
              display: ["Public Sans"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Public Sans", sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen"
  >
    <div
      class="max-w-2xl mx-auto min-h-screen flex flex-col bg-white dark:bg-stone-900 shadow-xl"
    >
      <!-- Header -->
      <div
        class="flex items-center p-4 border-b border-stone-200 dark:border-stone-800 sticky top-0 bg-white/80 dark:bg-stone-900/80 backdrop-blur-md z-10"
      >
        <button
          class="p-2 hover:bg-stone-100 dark:hover:bg-stone-800 rounded-full transition-colors"
        >
          <span
            class="material-symbols-outlined text-stone-600 dark:text-stone-400"
            >arrow_back</span
          >
        </button>
        <h1 class="text-xl font-bold ml-2 flex-1">Manual Donation Entry</h1>
        <button
          class="p-2 hover:bg-stone-100 dark:hover:bg-stone-800 rounded-full transition-colors text-primary"
        >
          <span class="material-symbols-outlined">help_outline</span>
        </button>
      </div>
      <!-- Form Content -->
      <div class="flex-1 overflow-y-auto p-4 space-y-6 pb-24">
        <!-- Section: Donor Identification -->
        <section class="space-y-4">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">person</span>
            <h2 class="text-lg font-semibold">Donor Information</h2>
          </div>
          <div class="space-y-3">
            <label class="block">
              <span
                class="text-sm font-medium text-stone-600 dark:text-stone-400 mb-1 block"
                >Search Registered Member</span
              >
              <div class="relative group">
                <span
                  class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 group-focus-within:text-primary transition-colors"
                  >search</span
                >
                <input
                  class="w-full pl-10 pr-4 py-3 bg-stone-100 dark:bg-stone-800 border-transparent rounded-lg focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-stone-700 transition-all text-sm outline-none"
                  placeholder="Search by name or member ID"
                  type="text"
                />
              </div>
            </label>
            <div class="flex items-center py-2">
              <div class="flex-1 h-px bg-stone-200 dark:bg-stone-800"></div>
              <span
                class="px-3 text-xs font-bold text-stone-400 uppercase tracking-widest"
                >OR</span
              >
              <div class="flex-1 h-px bg-stone-200 dark:bg-stone-800"></div>
            </div>
            <label class="block">
              <span
                class="text-sm font-medium text-stone-600 dark:text-stone-400 mb-1 block"
                >Manual Donor Name (Unregistered)</span
              >
              <input
                class="w-full px-4 py-3 bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm outline-none"
                placeholder="Enter full name"
                type="text"
              />
            </label>
          </div>
        </section>
        <!-- Section: Transaction Details -->
        <section class="space-y-4">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">payments</span>
            <h2 class="text-lg font-semibold">Transaction Details</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="block">
              <span
                class="text-sm font-medium text-stone-600 dark:text-stone-400 mb-1 block"
                >Amount (₹)</span
              >
              <input
                class="w-full px-4 py-3 bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm outline-none font-mono"
                placeholder="0.00"
                type="number"
              />
            </label>
            <label class="block">
              <span
                class="text-sm font-medium text-stone-600 dark:text-stone-400 mb-1 block"
                >Date of Donation</span
              >
              <input
                class="w-full px-4 py-3 bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm outline-none"
                type="date"
              />
            </label>
          </div>
          <div class="space-y-3">
            <span
              class="text-sm font-medium text-stone-600 dark:text-stone-400 block"
              >Payment Mode</span
            >
            <div class="grid grid-cols-3 gap-2">
              <button
                class="flex flex-col items-center justify-center p-3 rounded-xl border-2 border-primary bg-primary/10 text-primary"
              >
                <span class="material-symbols-outlined">payments</span>
                <span class="text-xs font-semibold mt-1">Cash</span>
              </button>
              <button
                class="flex flex-col items-center justify-center p-3 rounded-xl border-2 border-stone-200 dark:border-stone-800 hover:border-primary/50 transition-colors"
              >
                <span class="material-symbols-outlined">account_balance</span>
                <span
                  class="text-xs font-semibold mt-1 text-stone-600 dark:text-stone-400"
                  >Transfer</span
                >
              </button>
              <button
                class="flex flex-col items-center justify-center p-3 rounded-xl border-2 border-stone-200 dark:border-stone-800 hover:border-primary/50 transition-colors"
              >
                <span class="material-symbols-outlined">style</span>
                <span
                  class="text-xs font-semibold mt-1 text-stone-600 dark:text-stone-400"
                  >Cheque</span
                >
              </button>
            </div>
          </div>
          <label class="block">
            <span
              class="text-sm font-medium text-stone-600 dark:text-stone-400 mb-1 block"
              >Reference/Transaction Number</span
            >
            <input
              class="w-full px-4 py-3 bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm outline-none"
              placeholder="e.g. UPI ID or Cheque No."
              type="text"
            />
          </label>
        </section>
        <!-- Section: Verification Upload -->
        <section class="space-y-4">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary"
              >cloud_upload</span
            >
            <h2 class="text-lg font-semibold">Verification Proof</h2>
          </div>
          <div
            class="border-2 border-dashed border-stone-300 dark:border-stone-700 rounded-xl p-8 flex flex-col items-center justify-center bg-stone-50 dark:bg-stone-800/50 hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors cursor-pointer group"
          >
            <div
              class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"
            >
              <span class="material-symbols-outlined text-primary text-3xl"
                >add_a_photo</span
              >
            </div>
            <p class="text-sm font-semibold">Upload Transaction Screenshot</p>
            <p class="text-xs text-stone-500 dark:text-stone-500 mt-1">
              PNG, JPG or PDF up to 5MB
            </p>
            <input
              accept="image/*,application/pdf"
              class="hidden"
              type="file"
            />
          </div>
        </section>
      </div>
      <!-- Footer Actions -->
      <div
        class="p-4 border-t border-stone-200 dark:border-stone-800 bg-white dark:bg-stone-900 sticky bottom-16"
      >
        <button
          class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-transform active:scale-95"
        >
          <span class="material-symbols-outlined">save</span>
          Save Donation Record
        </button>
      </div>
      <!-- Navigation Bar -->
      <div
        class="flex gap-2 border-t border-stone-200 dark:border-stone-800 bg-white dark:bg-stone-900 px-4 pb-3 pt-2 sticky bottom-0"
      >
        <a
          class="flex flex-1 flex-col items-center justify-end gap-1 text-stone-400 dark:text-stone-500"
          href="#"
        >
          <span class="material-symbols-outlined">home</span>
          <p class="text-xs font-medium">Home</p>
        </a>
        <a
          class="flex flex-1 flex-col items-center justify-end gap-1 text-primary"
          href="#"
        >
          <span
            class="material-symbols-outlined"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >volunteer_activism</span
          >
          <p class="text-xs font-medium">Donations</p>
        </a>
        <a
          class="flex flex-1 flex-col items-center justify-end gap-1 text-stone-400 dark:text-stone-500"
          href="#"
        >
          <span class="material-symbols-outlined">group</span>
          <p class="text-xs font-medium">Members</p>
        </a>
        <a
          class="flex flex-1 flex-col items-center justify-end gap-1 text-stone-400 dark:text-stone-500"
          href="#"
        >
          <span class="material-symbols-outlined">settings</span>
          <p class="text-xs font-medium">Settings</p>
        </a>
      </div>
    </div>
  </body>
</html>
