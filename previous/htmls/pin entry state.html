<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full text-[#f2780d] dark:text-orange-500 hover:bg-stone-100 dark:hover:bg-stone-900 transition-colors Active: scale-95 duration-100">

</button>
<h1 class="font-['Public_Sans'] font-bold text-lg tracking-tight text-on-surface">Security Check</h1>
</div>
<div class="w-10"></div> <!-- Spacer for center alignment logic -->

<main class="flex-1 flex flex-col items-center px-container-padding py-stack-gap-lg overflow-y-auto">

<div class="mt-8 mb-6 flex flex-col items-center gap-stack-gap-md">
<div class="w-24 h-24 rounded-full bg-surface-container flex items-center justify-center border-2 border-primary/20 shadow-lg">
<div class="w-20 h-20 rounded-full overflow-hidden">
<img class="w-full h-full object-cover" data-alt="Macro close-up of high-quality tanned leather with professional cobbler stitching and antique brass tools on a wooden workshop table" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBaX8A_id1VQA2tdskiICldFhKPjztTWpJ2lRo2WOWS9ivSLqnHh3ofAoDI2ukQDdOyvWqIqOa0a4mWVw8xoTUPVPgqsiKa9WW6GAxfSkcC3uVBy3iHaEX8X21VKq3ojMNPFLOdF-jMDcS0r-YfFv2WJ_g-IhIgBl4sAigFvzTxIN9vfXBFOjDl0SItlPGmdiaIlnOj0R0Re_hNv-hzl7md0UqO4dYS6ZLWYOuy1nIOiovABmsf0x00CQVuIO7gl_IV5VeYnh861hfm"/>
</div>
</div>
<div class="text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Welcome back,</h2>
<p class="font-display-xl text-display-xl text-primary-container -mt-1">Master Artisan</p>
</div>
</div>
<!-- PIN Indicator Section -->
<div class="flex flex-col items-center gap-stack-gap-lg w-full mb-stack-gap-lg">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Enter Security PIN</p>
<div class="flex gap-4">
<!-- 3 Filled -->
<div class="w-4 h-4 rounded-full bg-primary-container shadow-md"></div>
<div class="w-4 h-4 rounded-full bg-primary-container shadow-md"></div>
<div class="w-4 h-4 rounded-full bg-primary-container shadow-md"></div>
<!-- 3 Empty -->
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-surface-container-lowest"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-surface-container-lowest"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-surface-container-lowest"></div>
</div>
</div>
<!-- Numeric Keypad -->
<div class="grid grid-cols-3 gap-y-4 gap-x-8 mt-auto mb-stack-gap-lg">
<!-- Row 1 -->
<button class="w-16 h-16 flex items-center justify-center rounded-full font-title-md text-title-md text-on-surface hover:bg-surface-container-high active:scale-90 transition-all tap-highlight-transparent">1</button>
<button class="w-16 h-16 flex items-center justify-center rounded-full font-title-md text-title-md text-on-surface hover:bg-surface-container-high active:scale-90 transition-all tap-highlight-transparent">2</button>

<button class="w-16 h-16 flex items-center justify-center rounded-full font-title-md text-title-md text-on-surface hover:bg-surface-container-high active:scale-90 transition-all tap-highlight-transparent">5</button>

<!-- Row 4 -->
<button class="w-16 h-16 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high active:scale-90 transition-all tap-highlight-transparent">
<span class="material-symbols-outlined text-2xl" data-icon="fingerprint">fingerprint</span>
</button>
<button class="w-16 h-16 flex items-center justify-center rounded-full font-title-md text-title-md text-on-surface hover:bg-surface-container-high active:scale-90 transition-all tap-highlight-transparent">0</button>

</button>

<span class="material-symbols-outlined" data-icon="face">face</span>
                    Use Biometrics
                </button>

<div class="h-6 w-full flex justify-center items-center">
<div class="w-32 h-1.5 bg-stone-200 rounded-full"></div>
</div>
